name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Padma compiler
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify formatting
        run: cargo fmt --check
      - name: Run unit tests
        run: cargo test --locked
      - name: Build optimized compiler
        run: cargo build --release --locked
      - name: Run Bengali example
        run: ./target/release/padma run examples/hello-bn.pd
      - name: Run English example
        run: ./target/release/padma run examples/hello-en.pd
