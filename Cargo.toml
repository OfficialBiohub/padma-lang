[package]
name = "padma-lang"
version = "0.1.0"
edition = "2021"
description = "Padma: a Bangla-English hybrid programming language"
license = "MIT"
repository = "https://github.com/OfficialBiohub/padma-lang"
keywords = ["programming-language", "bangla", "bengali", "compiler", "education"]
categories = ["compilers", "command-line-utilities"]

[[bin]]
name = "padma"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true

[dependencies]
serde_json = "1.0.145"
